<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ToffyLabs | Build. Automate. Scale.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.92);
      border-bottom: 1px solid #222;
      backdrop-filter: blur(10px);
    }

    nav {
      max-width: 1100px;
      margin: auto;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .logo span {
      color: #00ff88;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    nav a:hover {
      color: #00ff88;
    }

    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background:
        radial-gradient(circle at top, #123b2b 0%, #050505 45%);
    }

    .hero h1 {
      font-size: clamp(45px, 8vw, 90px);
      line-height: 1;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: #00ff88;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #aaa;
      font-size: 18px;
    }

    .buttons {
      margin-top: 35px;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      margin: 7px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: #00ff88;
      color: #000;
    }

    .primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
    }

    .secondary {
      border: 1px solid #444;
      color: white;
      background: transparent;
    }

    .secondary:hover {
      border-color: #00ff88;
      color: #00ff88;
    }

    section {
      max-width: 1100px;
      margin: auto;
      padding: 90px 25px;
    }

    .section-title {
      text-align: center;
      font-size: 38px;
      margin-bottom: 15px;
    }

    .section-subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 45px;
    }

    .services,
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 15px;
      padding: 30px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: #00ff88;
    }

    .card h3 {
      color: #00ff88;
      margin-bottom: 12px;
    }

    .card p,
    .project p {
      color: #999;
    }

    .project {
      background: linear-gradient(145deg, #111, #080808);
      border: 1px solid #222;
      border-radius: 15px;
      padding: 28px;
      transition: 0.3s;
    }

    .project:hover {
      transform: translateY(-7px);
      border-color: #00ff88;
    }

    .project span {
      color: #00ff88;
      font-size: 13px;
      font-weight: bold;
    }

    .project h3 {
      margin: 12px 0;
    }

    .about {
      text-align: center;
      max-width: 750px;
    }

    .about p {
      color: #aaa;
      font-size: 17px;
    }
